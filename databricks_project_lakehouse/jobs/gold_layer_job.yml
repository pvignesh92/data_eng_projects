resources:
  jobs:
    lakehouse_gold_layer:
      name: "lakehouse_gold_layer"
      description: "Gold Layer Complete Transformation - Daily Sales Summary, Customer Lifetime Value, and Category Monthly Performance"
      email_notifications:
        no_alert_for_skipped_runs: false
      webhook_notifications: {}
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "33 0 23 * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      max_concurrent_runs: 1
      tasks:
        - task_key: transform_daily_sales_summary
          run_if: "ALL_SUCCESS"
          notebook_task:
            notebook_path: "../gold/notebooks/01_daily_sales_summary.py"
            base_parameters:
              catalog_name: "lakehouse_project"
              schema_name: "gold"
              silver_schema: "silver"
            source: "WORKSPACE"
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}

        - task_key: transform_customer_lifetime_value
          run_if: "ALL_SUCCESS"
          depends_on:
            - task_key: transform_daily_sales_summary
          notebook_task:
            notebook_path: "../gold/notebooks/02_customer_lifetime_value.py"
            base_parameters:
              catalog_name: "lakehouse_project"
              schema_name: "gold"
              silver_schema: "silver"
            source: "WORKSPACE"
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}

        - task_key: transform_category_monthly_performance
          run_if: "ALL_SUCCESS"
          depends_on:
            - task_key: transform_daily_sales_summary
            - task_key: transform_customer_lifetime_value
          notebook_task:
            notebook_path: "../gold/notebooks/03_category_monthly_performance.py"
            base_parameters:
              catalog_name: "lakehouse_project"
              schema_name: "gold"
              silver_schema: "silver"
            source: "WORKSPACE"
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}

      tags:
        Project: "Lakehouse_Project"
        ResourceClass: "serverless"
        Layer: "gold"
        Component: "complete_transformation"
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: "lakehouse_project"
        - name: schema_name
          default: "gold"
        - name: silver_schema
          default: "silver"
      environments:
        - environment_key: "Default"
          spec:
            client: "2"
      run_as:
        service_principal_name: "6134cc4f-5177-444a-90c8-9455b4b79cf1" 