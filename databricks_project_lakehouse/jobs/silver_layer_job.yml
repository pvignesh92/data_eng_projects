resources:
  jobs:
    lakehouse_silver_layer:
      name: "lakehouse_silver_layer"
      description: "Silver Layer Complete Transformation - Customer Summary, Product Performance, and Order Line Fact"
      email_notifications:
        no_alert_for_skipped_runs: false
      webhook_notifications: {}
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "33 0 22 * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      max_concurrent_runs: 1
      tasks:
        - task_key: transform_customer_order_summary
          run_if: "ALL_SUCCESS"
          notebook_task:
            notebook_path: "../silver/notebooks/01_customer_order_summary.py"
            base_parameters:
              catalog_name: "lakehouse_project"
              schema_name: "silver"
              bronze_schema: "bronze"
            source: "WORKSPACE"
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}

        - task_key: transform_product_performance
          run_if: "ALL_SUCCESS"
          depends_on:
            - task_key: transform_customer_order_summary
          notebook_task:
            notebook_path: "../silver/notebooks/02_product_performance.py"
            base_parameters:
              catalog_name: "lakehouse_project"
              schema_name: "silver"
              bronze_schema: "bronze"
            source: "WORKSPACE"
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}

        - task_key: transform_order_line_fact
          run_if: "ALL_SUCCESS"
          depends_on:
            - task_key: transform_customer_order_summary
            - task_key: transform_product_performance
          notebook_task:
            notebook_path: "../silver/notebooks/03_order_line_fact.py"
            base_parameters:
              catalog_name: "lakehouse_project"
              schema_name: "silver"
              bronze_schema: "bronze"
            source: "WORKSPACE"
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}

      tags:
        Project: "Lakehouse_Project"
        ResourceClass: "serverless"
        Layer: "silver"
        Component: "complete_transformation"
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: "lakehouse_project"
        - name: schema_name
          default: "silver"
        - name: bronze_schema
          default: "bronze"
      environments:
        - environment_key: "Default"
          spec:
            client: "2"
      run_as:
        service_principal_name: "6134cc4f-5177-444a-90c8-9455b4b79cf1" 